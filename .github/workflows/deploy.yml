name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build
        env:
          # Set this in GitHub → repo Settings → Secrets and variables →
          # Actions → Variables → New repository variable, name
          # PAWLOOK_API_URL, value = your deployed backend URL
          # (e.g. https://your-project.vercel.app/api/generate).
          # This is a public URL, not a secret, but "vars" keeps it out
          # of the workflow file so it's easy to change without a commit.
          PAWLOOK_API_URL: ${{ vars.PAWLOOK_API_URL }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
